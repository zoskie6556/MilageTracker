<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vehicles - FuelTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-4" style="max-width: 720px">
    <a th:href="@{/}">FuelTrack</a>
    <h1 class="mt-3">Your vehicles</h1>
    <div class="alert alert-success" th:if="${param.created}">Vehicle added.</div>
    <ul class="list-group mb-4" th:if="${!#lists.isEmpty(vehicles)}">
        <li class="list-group-item d-flex justify-content-between" th:each="vehicle : ${vehicles}">
            <span th:text="${vehicle.name}">Vehicle name</span>
            <span class="text-body-secondary" th:if="${vehicle.plate}" th:text="${vehicle.plate}">Plate</span>
        </li>
    </ul>
    <p th:if="${#lists.isEmpty(vehicles)}">Add a vehicle before recording a mileage reading.</p>
    <h2 class="h4">Add a vehicle</h2>
    <form method="post" th:action="@{/vehicles}" th:object="${vehicleForm}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="mb-3">
            <label class="form-label" for="name">Name</label>
            <input class="form-control" id="name" th:field="*{name}" maxlength="100" required>
            <div class="text-danger" th:errors="*{name}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="plate">Registration plate (optional)</label>
            <input class="form-control" id="plate" th:field="*{plate}" maxlength="30">
            <div class="text-danger" th:errors="*{plate}"></div>
        </div>
        <button class="btn btn-primary" type="submit">Save vehicle</button>
        <a class="btn btn-link" th:href="@{/readings/new}">Add a reading</a>
    </form>
</main>
</body>
</html>

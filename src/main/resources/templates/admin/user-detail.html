<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>User details - FuelTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-4">
    <a th:href="@{/admin/users}">Back to users</a>
    <h1 class="mt-3" th:text="${userDetail.email}">User email</h1>
    <p>Account status:
        <span class="badge" th:classappend="${userDetail.enabled} ? 'text-bg-success' : 'text-bg-secondary'"
              th:text="${userDetail.enabled} ? 'Enabled' : 'Disabled'">Enabled</span>
    </p>

    <section class="mb-4">
        <h2 class="h4">Vehicles</h2>
        <ul class="list-group" th:if="${!#lists.isEmpty(userDetail.vehicles)}">
            <li class="list-group-item" th:each="vehicle : ${userDetail.vehicles}">
                <strong th:text="${vehicle.name}">Vehicle</strong>
                <span class="text-body-secondary" th:if="${vehicle.plate}" th:text="' - ' + ${vehicle.plate}"></span>
            </li>
        </ul>
        <p th:if="${#lists.isEmpty(userDetail.vehicles)}">No vehicles.</p>
    </section>

    <section class="mb-4">
        <h2 class="h4">Odometer readings</h2>
        <div class="table-responsive" th:if="${!#lists.isEmpty(userDetail.readings)}">
            <table class="table table-striped align-middle">
                <thead><tr><th>Date</th><th>Vehicle</th><th>Odometer</th><th>Day</th><th>Source</th><th>Photo</th><th>Note</th></tr></thead>
                <tbody>
                <tr th:each="reading : ${userDetail.readings}">
                    <td th:text="${#temporals.format(reading.takenAt.atZone(T(java.time.ZoneId).of('Africa/Gaborone')), 'yyyy-MM-dd HH:mm')}"></td>
                    <td th:text="${reading.vehicleName}"></td>
                    <td th:text="${reading.readingKm} + ' km'"></td>
                    <td th:text="${reading.dayMoment == T(com.fueltrack.model.DayMoment).START_OF_DAY ? 'Start of day' : 'End of day'}"></td>
                    <td>
                        <span th:class="'badge ' + (${reading.source.name() == 'AI'} ? 'text-bg-info' : (${reading.source.name() == 'AI_EDITED'} ? 'text-bg-warning' : 'text-bg-secondary'))"
                              th:text="${reading.source.name() == 'AI' ? 'AI' : (reading.source.name() == 'AI_EDITED' ? 'AI edited' : 'Manual')}">Manual</span>
                    </td>
                    <td>
                        <img th:if="${reading.photoPath}" class="img-thumbnail" style="max-width: 100px; max-height: 80px"
                             th:src="@{/admin/users/{userId}/photos/{name}(userId=${userDetail.id},name=${reading.photoPath})}"
                             alt="Odometer photo">
                        <span th:unless="${reading.photoPath}" class="text-body-secondary">—</span>
                    </td>
                    <td th:text="${reading.note}"></td>
                </tr>
                </tbody>
            </table>
        </div>
        <p th:if="${#lists.isEmpty(userDetail.readings)}">No readings.</p>
    </section>

    <section>
        <h2 class="h4">Fuel fill-ups</h2>
        <div class="table-responsive" th:if="${!#lists.isEmpty(userDetail.fillUps)}">
            <table class="table table-striped">
                <thead><tr><th>Date</th><th>Vehicle</th><th>Odometer</th><th>Litres</th><th>Cost</th><th>Full tank</th></tr></thead>
                <tbody>
                <tr th:each="fillUp : ${userDetail.fillUps}">
                    <td th:text="${#temporals.format(fillUp.filledAt.atZone(T(java.time.ZoneId).of('Africa/Gaborone')), 'yyyy-MM-dd HH:mm')}"></td>
                    <td th:text="${fillUp.vehicleName}"></td>
                    <td th:text="${fillUp.odometerKm} + ' km'"></td>
                    <td th:text="${fillUp.litres}"></td>
                    <td th:text="${fillUp.totalCost}"></td>
                    <td th:text="${fillUp.fullTank ? 'Yes' : 'No'}"></td>
                </tr>
                </tbody>
            </table>
        </div>
        <p th:if="${#lists.isEmpty(userDetail.fillUps)}">No fill-ups.</p>
    </section>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Manage users - FuelTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-4">
    <a th:href="@{/}">FuelTrack</a>
    <h1 class="mt-3">User administration</h1>
    <div class="alert alert-success" th:if="${accountUpdated}" th:text="${accountUpdated}"></div>
    <div class="alert alert-danger" th:if="${accountError}" th:text="${accountError}"></div>
    <form class="row g-2 mb-3" method="get" th:action="@{/admin/users}">
        <div class="col">
            <label class="visually-hidden" for="q">Search email</label>
            <input class="form-control" id="q" name="q" placeholder="Search by email" th:value="${query}">
        </div>
        <div class="col-auto">
            <button class="btn btn-primary" type="submit">Search</button>
        </div>
    </form>

    <div class="table-responsive">
        <table class="table table-striped align-middle">
            <thead>
            <tr><th>Email</th><th>Status</th><th>Vehicles</th><th>Total km recorded</th><th>Last reading</th><th>Actions</th></tr>
            </thead>
            <tbody>
            <tr th:each="account : ${users.content}">
                <td><a th:href="@{/admin/users/{id}(id=${account.id})}" th:text="${account.email}">email</a></td>
                <td>
                    <span class="badge" th:classappend="${account.enabled} ? 'text-bg-success' : 'text-bg-secondary'"
                          th:text="${account.enabled} ? 'Enabled' : 'Disabled'">Enabled</span>
                </td>
                <td th:text="${account.vehicleCount}"></td>
                <td th:text="${account.totalKmRecorded}"></td>
                <td th:text="${account.lastReadingAt == null ? '—' : #temporals.format(account.lastReadingAt.atZone(T(java.time.ZoneId).of('Africa/Gaborone')), 'yyyy-MM-dd HH:mm')}"></td>
                <td>
                    <form method="post" th:if="${account.enabled}"
                          th:action="@{/admin/users/{id}/disable(id=${account.id})}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button class="btn btn-sm btn-outline-danger" type="submit">Disable</button>
                    </form>
                    <form method="post" th:unless="${account.enabled}"
                          th:action="@{/admin/users/{id}/enable(id=${account.id})}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button class="btn btn-sm btn-outline-success" type="submit">Enable</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${users.empty}">
                <td colspan="6" class="text-center">No matching users.</td>
            </tr>
            </tbody>
        </table>
    </div>
    <nav th:if="${users.totalPages > 1}" aria-label="User pages">
        <ul class="pagination">
            <li class="page-item" th:classappend="${users.first} ? 'disabled'">
                <a class="page-link" th:href="@{/admin/users(q=${query},page=${users.number - 1})}">Previous</a>
            </li>
            <li class="page-item disabled">
                <span class="page-link" th:text="${users.number + 1} + ' / ' + ${users.totalPages}">1 / 1</span>
            </li>
            <li class="page-item" th:classappend="${users.last} ? 'disabled'">
                <a class="page-link" th:href="@{/admin/users(q=${query},page=${users.number + 1})}">Next</a>
            </li>
        </ul>
    </nav>
</main>
</body>
</html>

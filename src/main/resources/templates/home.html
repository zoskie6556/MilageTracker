<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FuelTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand bg-dark navbar-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">FuelTrack</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" th:href="@{/readings}">History</a>
            <a class="nav-link" th:href="@{/vehicles}">Vehicles</a>
            <form class="nav-item" method="post" th:action="@{/logout}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button class="nav-link btn" type="submit">Sign out</button>
            </form>
        </div>
    </div>
</nav>
<main class="container py-4">
    <h1>Track your mileage</h1>
    <p class="text-body-secondary">Record odometer readings and keep your vehicle history up to date.</p>
    <a class="btn btn-primary" th:href="@{/readings/new}">Add reading</a>
    <a class="btn btn-outline-secondary" th:href="@{/readings}">View history</a>
    <a class="btn btn-outline-secondary" th:href="@{/summary}">Mileage summary</a>
    <a class="btn btn-outline-secondary" th:href="@{/fill-ups}">Fuel fill-ups</a>
</main>
</body>
</html>

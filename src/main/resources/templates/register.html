<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create account - FuelTrack</title>
    <meta name="theme-color" content="#132e35">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="bg-light">
<main class="container flex min-h-screen items-center justify-center py-10">
    <section class="ft-auth-card">
    <div class="mb-7" th:replace="~{fragments/layout :: auth-brand}"></div>
    <p class="ft-page-kicker">Get started</p>
    <h1 class="mb-6">Create your account</h1>
    <form method="post" th:action="@{/register}" th:object="${registrationForm}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input class="form-control" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                   id="email" th:field="*{email}" type="email" autocomplete="email" required>
            <div class="invalid-feedback" th:errors="*{email}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input class="form-control" th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                   id="password" th:field="*{password}" type="password" autocomplete="new-password" required>
            <div class="form-text">At least 8 characters, including a letter and a digit.</div>
            <div class="invalid-feedback" th:errors="*{password}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="confirmPassword">Confirm password</label>
            <input class="form-control" th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'"
                   id="confirmPassword" th:field="*{confirmPassword}" type="password"
                   autocomplete="new-password" required>
            <div class="invalid-feedback" th:errors="*{confirmPassword}"></div>
        </div>
        <button class="btn btn-primary w-100 mt-2" type="submit">Create account</button>
    </form>
        <p class="mt-6 text-center text-sm text-body-secondary"><a class="font-semibold" th:href="@{/login}">Back to sign in</a></p>
        </section>
</main>
<div th:replace="~{fragments/layout :: ui}"></div>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create account - FuelTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5" style="max-width: 480px">
    <h1 class="mb-4">Create your account</h1>
    <form method="post" th:action="@{/register}" th:object="${registrationForm}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input class="form-control" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                   id="email" th:field="*{email}" type="email" autocomplete="email" required>
            <div class="invalid-feedback" th:errors="*{email}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input class="form-control" th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                   id="password" th:field="*{password}" type="password" autocomplete="new-password" required>
            <div class="form-text">At least 8 characters, including a letter and a digit.</div>
            <div class="invalid-feedback" th:errors="*{password}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="confirmPassword">Confirm password</label>
            <input class="form-control" th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'"
                   id="confirmPassword" th:field="*{confirmPassword}" type="password"
                   autocomplete="new-password" required>
            <div class="invalid-feedback" th:errors="*{confirmPassword}"></div>
        </div>
        <button class="btn btn-primary w-100" type="submit">Register</button>
    </form>
    <p class="mt-3"><a th:href="@{/login}">Back to sign in</a></p>
</main>
</body>
</html>

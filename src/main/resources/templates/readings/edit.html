<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit reading - FuelTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-4" style="max-width: 640px">
    <a th:href="@{/readings}">Back to history</a>
    <h1 class="mt-3">Edit reading</h1>
    <div class="mb-3" th:if="${reading.photoPath}">
        <img class="img-thumbnail" style="max-height: 240px"
             th:src="@{/readings/photo/{name}(name=${reading.photoPath})}" alt="Odometer photo">
    </div>
    <p>Source: <span class="badge text-bg-secondary"
                      th:text="${reading.source.name() == 'AI' ? 'AI' : (reading.source.name() == 'AI_EDITED' ? 'AI edited' : 'Manual')}">Manual</span></p>
    <div class="alert alert-warning" th:if="${!#lists.isEmpty(warnings)}">
        <p class="mb-1" th:each="warning : ${warnings}" th:text="${warning.message}"></p>
        <p class="mb-0">You can continue if this reading is correct.</p>
    </div>
    <form method="post" th:action="@{/readings/{id}/edit(id=${reading.id})}" th:object="${readingEditForm}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="mb-3">
            <label class="form-label" for="vehicleId">Vehicle</label>
            <select class="form-select" id="vehicleId" th:field="*{vehicleId}" required>
                <option value="">Choose a vehicle</option>
                <option th:each="vehicle : ${vehicles}" th:value="${vehicle.id}" th:text="${vehicle.name}"></option>
            </select>
            <div class="text-danger" th:errors="*{vehicleId}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="readingKm">Mileage (km)</label>
            <input class="form-control" id="readingKm" th:field="*{readingKm}" type="number"
                   min="1" step="1" inputmode="numeric" required>
            <div class="text-danger" th:errors="*{readingKm}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="takenAt">Date and time</label>
            <input class="form-control" id="takenAt" th:field="*{takenAt}" type="datetime-local" required>
            <div class="text-danger" th:errors="*{takenAt}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="dayMoment">Reading time of day</label>
            <select class="form-select" id="dayMoment" th:field="*{dayMoment}">
                <option value="START_OF_DAY">Start of day</option>
                <option value="END_OF_DAY">End of day</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label" for="note">Note (optional)</label>
            <input class="form-control" id="note" th:field="*{note}" maxlength="500">
            <div class="text-danger" th:errors="*{note}"></div>
        </div>
        <div class="form-check mb-3" th:if="${!#lists.isEmpty(warnings)}">
            <input class="form-check-input" id="confirmWarning" th:field="*{confirmWarning}" type="checkbox">
            <label class="form-check-label" for="confirmWarning">I checked this reading and want to save it.</label>
        </div>
        <button class="btn btn-primary" type="submit">Update reading</button>
    </form>
</main>
</body>
</html>

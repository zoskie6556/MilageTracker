<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add reading - FuelTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-4" style="max-width: 850px">
    <a th:href="@{/}">FuelTrack</a>
    <h1 class="mt-3 mb-4">Add reading</h1>
    <div class="alert alert-info" th:if="${#lists.isEmpty(vehicles)}">
        Add a vehicle first to record a reading. <a th:href="@{/vehicles}">Manage vehicles</a>
    </div>
    <div class="row g-3">
        <div class="col-md-6">
            <section class="card h-100">
                <div class="card-body d-flex flex-column">
                    <h2 class="h4">Take or upload a photo</h2>
                    <p class="text-body-secondary">Let AI read the odometer, then check and confirm the result.</p>
                    <a class="btn btn-primary mt-auto" th:href="@{/readings/new/photo}"
                       th:classappend="${#lists.isEmpty(vehicles)} ? 'disabled'">Choose photo</a>
                </div>
            </section>
        </div>
        <div class="col-md-6">
            <section class="card h-100">
                <div class="card-body d-flex flex-column">
                    <h2 class="h4">Enter mileage manually</h2>
                    <p class="text-body-secondary">Enter the odometer value yourself. A photo is optional.</p>
                    <a class="btn btn-outline-primary mt-auto" th:href="@{/readings/new/manual}"
                       th:classappend="${#lists.isEmpty(vehicles)} ? 'disabled'">Enter mileage</a>
                </div>
            </section>
        </div>
    </div>
    <a class="btn btn-link px-0 mt-3" th:href="@{/readings}">View reading history</a>
</main>
</body>
</html>

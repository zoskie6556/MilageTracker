<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reading history - FuelTrack</title>
    <meta name="theme-color" content="#132e35">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="bg-light">
<nav th:replace="~{fragments/layout :: navigation}"></nav>
<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mt-3 mb-3">
        <h1 class="h2">Reading history</h1>
        <div>
            <a class="btn btn-outline-primary" th:href="@{/summary}">Summary</a>
            <a class="btn btn-primary" th:href="@{/readings/new}">Add reading</a>
        </div>
    </div>
    <div class="alert alert-success" data-toast th:if="${readingSaved}">Reading saved.</div>
    <div class="alert alert-success" data-toast th:if="${readingUpdated}">Reading updated.</div>
    <div class="alert alert-success" data-toast th:if="${readingDeleted}">Reading deleted.</div>
    <div class="table-responsive" th:if="${!#lists.isEmpty(readings)}">
        <table class="table table-striped align-middle">
            <thead>
            <tr><th>Date and time</th><th>Vehicle</th><th>Odometer</th><th>Day</th><th>Source</th><th>Photo</th><th>Note</th><th>Actions</th></tr>
            </thead>
            <tbody>
            <tr th:each="reading : ${readings}">
                <td th:text="${#temporals.format(reading.takenAt.atZone(T(java.time.ZoneId).of('Africa/Gaborone')), 'yyyy-MM-dd HH:mm')}"></td>
                <td th:text="${reading.vehicle.name}"></td>
                <td th:text="${reading.readingKm} + ' km'"></td>
                <td th:text="${reading.dayMoment == T(com.fueltrack.model.DayMoment).START_OF_DAY ? 'Start of day' : 'End of day'}"></td>
                <td>
                    <span th:class="'badge ' + (${reading.source.name() == 'AI'} ? 'text-bg-info' : (${reading.source.name() == 'AI_EDITED'} ? 'text-bg-warning' : 'text-bg-secondary'))"
                          th:text="${reading.source.name() == 'AI' ? 'AI' : (reading.source.name() == 'AI_EDITED' ? 'AI edited' : 'Manual')}">Manual</span>
                </td>
                <td>
                    <a th:if="${reading.photoPath}" th:href="@{/readings/photo/{name}(name=${reading.photoPath})}">
                        <img class="img-thumbnail" style="max-width: 90px; max-height: 70px"
                             th:src="@{/readings/photo/{name}(name=${reading.photoPath})}" alt="Odometer photo">
                    </a>
                    <span th:unless="${reading.photoPath}" class="text-body-secondary">—</span>
                </td>
                <td th:text="${reading.note}"></td>
                <td class="text-nowrap">
                    <a class="btn btn-sm btn-outline-primary" th:href="@{/readings/{id}/edit(id=${reading.id})}">Edit</a>
                    <form class="d-inline" method="post" th:action="@{/readings/{id}/delete(id=${reading.id})}"
                          onsubmit="return confirm('Delete this reading?')">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button class="btn btn-sm btn-outline-danger" type="submit">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <p th:if="${#lists.isEmpty(readings)}">No readings yet. <a th:href="@{/readings/new}">Add your first reading</a>.</p>
</main>
<div th:replace="~{fragments/layout :: ui}"></div>
</body>
</html>

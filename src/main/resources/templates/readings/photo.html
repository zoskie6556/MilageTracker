<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Odometer photo - FuelTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-4" style="max-width: 640px">
    <a th:href="@{/readings/new}">Back to options</a>
    <h1 class="mt-3">Take or upload a photo</h1>
    <div class="alert alert-danger" th:if="${photoError}" th:text="${photoError}"></div>
    <form method="post" enctype="multipart/form-data" th:action="@{/readings/photo}" th:object="${photoUploadForm}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="mb-3">
            <label class="form-label" for="vehicleId">Vehicle</label>
            <select class="form-select" id="vehicleId" th:field="*{vehicleId}" required>
                <option value="">Choose a vehicle</option>
                <option th:each="vehicle : ${vehicles}" th:value="${vehicle.id}" th:text="${vehicle.name}"></option>
            </select>
            <div class="text-danger" th:errors="*{vehicleId}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="photo">Odometer photo</label>
            <input class="form-control" id="photo" th:field="*{photo}" type="file"
                   accept="image/jpeg,image/png,image/webp" capture="environment" required>
            <div class="form-text">JPEG, PNG or WebP; maximum 10 MB.</div>
            <div class="text-danger" th:errors="*{photo}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="takenAt">Date and time</label>
            <input class="form-control" id="takenAt" th:field="*{takenAt}" type="datetime-local" required>
            <div class="text-danger" th:errors="*{takenAt}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="dayMoment">Reading time of day</label>
            <select class="form-select" id="dayMoment" th:field="*{dayMoment}">
                <option value="START_OF_DAY">Start of day</option>
                <option value="END_OF_DAY">End of day</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label" for="note">Note (optional)</label>
            <input class="form-control" id="note" th:field="*{note}" maxlength="500"
                   placeholder="e.g. start of day, end of day, after fuel stop">
        </div>
        <button class="btn btn-primary" type="submit">Read photo</button>
        <a class="btn btn-outline-secondary" th:href="@{/readings/new/manual}">Enter manually instead</a>
    </form>
</main>
</body>
</html>

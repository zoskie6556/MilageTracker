<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Manual mileage - FuelTrack</title>
    <meta name="theme-color" content="#132e35">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="bg-light">
<nav th:replace="~{fragments/layout :: navigation}"></nav>
<main class="container py-4" style="max-width: 640px">
    <a th:href="@{/readings/new}">Back to options</a>
    <p class="ft-page-kicker mt-6">Manual entry</p>
    <h1>Enter mileage manually</h1>
    <p class="mb-6 text-body-secondary">Enter the number shown on your odometer. You can attach a photo too, but it’s optional.</p>
    <div class="alert alert-warning" th:if="${aiFailureMessage}">
        <span th:text="${aiFailureMessage}">AI could not read the photo.</span>
        Your photo is still attached; enter or correct the mileage below.
    </div>
    <div class="mb-3" th:if="${photoPath}">
        <img class="img-thumbnail" style="max-height: 220px" th:src="@{/readings/photo/{name}(name=${photoPath})}"
             alt="Attached odometer photo">
    </div>
    <form method="post" th:action="@{/readings/new/manual}" th:object="${manualReadingForm}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="mb-3">
            <label class="form-label" for="vehicleId">Vehicle</label>
            <select class="form-select" id="vehicleId" th:field="*{vehicleId}" required>
                <option value="">Choose a vehicle</option>
                <option th:each="vehicle : ${vehicles}" th:value="${vehicle.id}" th:text="${vehicle.name}"></option>
            </select>
            <div class="text-danger" th:errors="*{vehicleId}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="readingKm">Mileage (km)</label>
            <input class="form-control" id="readingKm" th:field="*{readingKm}" type="number"
                   min="1" step="1" inputmode="numeric" required>
            <div class="text-danger" th:errors="*{readingKm}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="takenAt">Date and time</label>
            <input class="form-control" id="takenAt" th:field="*{takenAt}" type="datetime-local" required>
            <div class="text-danger" th:errors="*{takenAt}"></div>
            <div class="form-text">Displayed and entered in Africa/Gaborone time.</div>
        </div>
        <div class="mb-3">
            <label class="form-label" for="dayMoment">Reading time of day</label>
            <select class="form-select" id="dayMoment" th:field="*{dayMoment}">
                <option value="START_OF_DAY">Start of day</option>
                <option value="END_OF_DAY">End of day</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label" for="note">Note (optional)</label>
            <input class="form-control" id="note" th:field="*{note}" maxlength="500"
                   placeholder="e.g. start of day, end of day, after fuel stop">
            <div class="text-danger" th:errors="*{note}"></div>
        </div>
        <button class="btn btn-primary" type="submit">Continue to confirmation</button>
    </form>
</main>
<div th:replace="~{fragments/layout :: ui}"></div>
</body>
</html>

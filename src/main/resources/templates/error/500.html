<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Something went wrong - FuelTrack</title>
    <meta name="theme-color" content="#132e35">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="bg-light">
<main class="container py-5">
    <h1>Something went wrong</h1>
    <p>We could not complete that request. Please try again later.</p>
    <p class="text-body-secondary" th:if="${errorId}">Reference: <code th:text="${errorId}"></code></p>
    <a th:href="@{/}">Return to FuelTrack</a>
</main>
<div th:replace="~{fragments/layout :: ui}"></div>
</body>
</html>

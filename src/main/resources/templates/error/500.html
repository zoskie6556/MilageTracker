<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Something went wrong - FuelTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5">
    <h1>Something went wrong</h1>
    <p>We could not complete that request. Please try again later.</p>
    <p class="text-body-secondary" th:if="${errorId}">Reference: <code th:text="${errorId}"></code></p>
    <a th:href="@{/}">Return to FuelTrack</a>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Upload too large - FuelTrack</title>
    <meta name="theme-color" content="#132e35">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="bg-light">
<main class="container py-5">
    <h1>Upload too large</h1>
    <p th:text="${message}">Photos must be 10 MB or smaller.</p>
    <a th:href="@{/readings/new}">Return to readings</a>
</main>
<div th:replace="~{fragments/layout :: ui}"></div>
</body>
</html>

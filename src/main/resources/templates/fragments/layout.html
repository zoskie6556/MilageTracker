<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="navigation" class="ft-nav">
    <div class="ft-nav-inner">
        <a class="ft-brand" th:href="@{/}">
            <span class="ft-brand-mark">
                <svg aria-hidden="true" class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 17h14l-1.3-5.8a2 2 0 0 0-2-1.6H8.3a2 2 0 0 0-2 1.6L5 17Z"></path>
                    <path d="M7 17v2m10-2v2M7.5 13h.01M16.5 13h.01M8 9.5l1-3h6l1 3"></path>
                </svg>
            </span>
            <span>FuelTrack</span>
        </a>
        <div class="ft-nav-links">
            <a class="ft-nav-link" th:href="@{/readings}">
                <svg aria-hidden="true" class="ft-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M8 3H5a2 2 0 0 0-2 2v3m13-5h3a2 2 0 0 1 2 2v3M3 16v3a2 2 0 0 0 2 2h3m8 0h3a2 2 0 0 0 2-2v-3"></path>
                    <path d="M8 12h8m-8-4h5m-5 8h8"></path>
                </svg>
                <span>History</span>
            </a>
            <a class="ft-nav-link" th:href="@{/summary}">
                <svg aria-hidden="true" class="ft-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 3v18h18"></path><path d="m19 9-5 5-4-4-5 5"></path>
                </svg>
                <span>Summary</span>
            </a>
            <a class="ft-nav-link" th:href="@{/fill-ups}">
                <svg aria-hidden="true" class="ft-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M7 21h10M9 21V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v16M7 8h10M17 7h2l2 2v8a2 2 0 0 1-4 0v-4"></path>
                </svg>
                <span>Fuel</span>
            </a>
            <a class="ft-nav-link" th:href="@{/vehicles}">
                <svg aria-hidden="true" class="ft-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M5 17h14l-1.3-5.8a2 2 0 0 0-2-1.6H8.3a2 2 0 0 0-2 1.6L5 17Z"></path>
                    <path d="M7 17v2m10-2v2M7.5 13h.01M16.5 13h.01"></path>
                </svg>
                <span>Vehicles</span>
            </a>
            <a class="ft-nav-link" th:if="${isAdmin}" th:href="@{/admin/users}">
                <svg aria-hidden="true" class="ft-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2m12-13a4 4 0 1 1-8 0 4 4 0 0 1 8 0Zm2 5a4 4 0 0 1 4 4v2"></path>
                </svg>
                <span>Admin</span>
            </a>
            <form method="post" th:action="@{/logout}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button class="ft-nav-link ft-signout" type="submit" aria-label="Sign out">
                    <svg aria-hidden="true" class="ft-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                         stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M10 17l5-5-5-5m5 5H3m9-9h6a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-6"></path>
                    </svg>
                    <span>Sign out</span>
                </button>
            </form>
        </div>
    </div>
</nav>

<a th:fragment="auth-brand" class="ft-brand text-ink" th:href="@{/}">
    <span class="ft-brand-mark">
        <svg aria-hidden="true" class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 17h14l-1.3-5.8a2 2 0 0 0-2-1.6H8.3a2 2 0 0 0-2 1.6L5 17Z"></path>
            <path d="M7 17v2m10-2v2M7.5 13h.01M16.5 13h.01M8 9.5l1-3h6l1 3"></path>
        </svg>
    </span>
    <span>FuelTrack</span>
</a>

<div th:fragment="ui">
    <div id="toast-region" class="ft-toast-region" aria-live="polite" aria-relevant="additions"></div>
    <div id="loading-overlay" class="ft-loading-overlay hidden" aria-hidden="true" role="status" aria-live="polite">
        <div class="ft-loading-card">
            <span class="ft-spinner" aria-hidden="true"></span>
            <p id="loading-message" class="m-0 text-sm font-medium text-slate-700">Please wait while we save your changes.</p>
        </div>
    </div>
    <script defer th:src="@{/js/app.js}"></script>
</div>
</body>
</html>

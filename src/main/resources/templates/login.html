<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in - FuelTrack</title>
    <meta name="theme-color" content="#132e35">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="bg-light">
<main class="container flex min-h-screen items-center justify-center py-10">
    <section class="ft-auth-card">
    <div class="mb-7" th:replace="~{fragments/layout :: auth-brand}"></div>
    <p class="ft-page-kicker">Welcome back</p>
    <h1 class="mb-2">Sign in to FuelTrack</h1>
    <p class="mb-6 text-sm text-body-secondary">Your mileage and fuel history, all in one place.</p>
    <div class="alert alert-success" data-toast th:if="${param.registered}">Registration complete. Please sign in.</div>
    <div class="alert alert-danger" data-toast th:if="${param.error}">Invalid email or password.</div>
    <div class="alert alert-info" data-toast th:if="${param.logout}">You have been signed out.</div>
    <form method="post" th:action="@{/login}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input class="form-control" id="email" name="email" type="email" autocomplete="username" required>
        </div>
        <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input class="form-control" id="password" name="password" type="password"
                   autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary w-100 mt-2" type="submit">Sign in</button>
    </form>
    <p class="mt-6 text-center text-sm text-body-secondary">New to FuelTrack? <a class="font-semibold" th:href="@{/register}">Create an account</a></p>
    </section>
</main>
<div th:replace="~{fragments/layout :: ui}"></div>
</body>
</html>

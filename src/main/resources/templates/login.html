<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in - FuelTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5" style="max-width: 480px">
    <h1 class="mb-4">FuelTrack</h1>
    <div class="alert alert-success" th:if="${param.registered}">Registration complete. Please sign in.</div>
    <div class="alert alert-danger" th:if="${param.error}">Invalid email or password.</div>
    <div class="alert alert-info" th:if="${param.logout}">You have been signed out.</div>
    <form method="post" th:action="@{/login}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input class="form-control" id="email" name="email" type="email" autocomplete="username" required>
        </div>
        <div class="mb-3">
            <label class="form-label" for="password">Password</label>
            <input class="form-control" id="password" name="password" type="password"
                   autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary w-100" type="submit">Sign in</button>
    </form>
    <p class="mt-3">New to FuelTrack? <a th:href="@{/register}">Create an account</a></p>
</main>
</body>
</html>

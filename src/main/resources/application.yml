spring:
  application:
    name: FuelTrack
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

server:
  error:
    whitelabel:
      enabled: false

app:
  upload-dir: ${UPLOAD_DIR:./uploads}
  ai:
    model: ${APP_AI_MODEL:claude-sonnet-5-5}
